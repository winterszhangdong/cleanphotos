<script type="module">

  // 数字滚动（MB）
  const bnum = $('#lb b');
  if (bnum && /MB/.test(big)) { const target = +bnum.dataset.v || +bnum.textContent; bnum.dataset.v = target; bnum.textContent = Math.round(target * eExpo(prog(t, a, a + .32))); }
}

// ---------- 实拍 ----------
let curSrc = '';
function cutAt(t) { return CUTS.find(([a, b]) => t >= a && t < b) ?? (t >= 20 && t < 20.35 ? CUTS[CUTS.length - 1] : null); }
async function setFootage(t) {
  const c = cutAt(t);
  if (!c) return null;
  const [a, , take, s0, sp] = c; const st = s0 + (Math.min(t, c[1] - 1e-6) - a) * sp;
  const n = Math.max(1, Math.round(st * FPS) + 1);
  const src = `../work/frames/${take}/${String(n).padStart(5, '0')}.jpg`;
  const img = $('#foot');
  if (src !== curSrc) { curSrc = src; img.src = src; $('#sbImg').src = src; try { await Promise.all([img.decode(), $('#sbImg').decode()]); } catch (e) {} }
  // 触点
  const els = $('#touches').children;
  TOUCHES.forEach((tc, i) => {
    const [kind, tk, t0] = tc; const dot = els[i * 2], ring = els[i * 2 + 1];
    let o = 0, x = tc[3], y = tc[4], ro = 0, rs = 1;
    if (tk === take) {
      const dt = st - t0;
      if (kind === 'swipe') { const dur = tc[7]; const p = clamp(dt / dur); x = lerp(tc[3], tc[5], eInOut(p)); y = lerp(tc[4], tc[6], eInOut(p)); o = dt < -.08 ? 0 : dt < 0 ? (dt + .08) / .08 : dt < dur ? 1 : clamp(1 - (dt - dur) / .12); }
      else { const k = kind === 'dbl' ? [0, .07] : [0]; for (const d0 of k) { const d = dt - d0; if (d > -.06 && d < .35) { o = Math.max(o, d < 0 ? (d + .06) / .06 : clamp(1 - d / .18)); if (d >= 0) { ro = Math.max(ro, 1 - d / .35); rs = 1 + d * 4; } } } }
    }
    css(dot, { left: x + 'px', top: y + 'px', opacity: o * .9 }); css(ring, { left: x + 'px', top: y + 'px', opacity: ro, transform: `scale(${rs})` });
  });
  return { take, st };
}

// ---------- 镜头：手机的位置 / 缩放 / 3D 倾斜 ----------
// 返回 {x, y (手机中心), z, fx, fy (对准的画面点，素材像素), rx, ry, rz, o}
const S = 0.518519, RIG_W = 588, RIG_H = 1272;
function camera(t) {
  let c = { x: 540, y: 1000, z: 1, fx: 540, fy: 1200, rx: 0, ry: 0, rz: 0, o: 1, blur: 0 };
  if (t < 3) return { ...c, o: 0 };
  if (t < 4) { const p = prog(t, 3, 3.55); c.y = lerp(-1400, 1000, spring(p, 7, 6)); c.rx = lerp(38, 0, eOut(p)); c.rz = lerp(-10, 0, eOut(p)); c.z = lerp(1.25, 1, eOut(prog(t, 3, 3.8))); c.ry = lerp(0, -6, prog(t, 3.5, 4)); }
  else if (t < 5) { c.ry = lerp(-10, -4, eOut(prog(t, 4, 5))); c.rx = lerp(6, 2, prog(t, 4, 5)); }
  else if (t < 6) { c.ry = lerp(10, 4, eOut(prog(t, 5, 6))); c.rx = lerp(-6, -2, prog(t, 5, 6)); }
  else if (t < 7) { const p = eInOut(prog(t, 6, 6.5)); c.z = lerp(1, 1.1, p); c.fy = lerp(1200, 1100, p); c.y = lerp(1000, 960, p); c.ry = lerp(0, -5, prog(t, 6, 7)); }
  else if (t < 7.84) { const p = eInOut(prog(t, 7, 7.3)); c.z = lerp(1.1, 1.5, p); c.fy = lerp(1100, 420, p); c.y = lerp(960, 700, p); c.ry = lerp(-5, -3, p); }
  else if (t < 9) { const p = eInOut(prog(t, 7.84, 8.25)); c.z = lerp(1.5, 1.85, p); c.fx = lerp(540, 330, p); c.fy = lerp(420, 300, p); c.y = lerp(700, 640, p); c.x = 540; c.ry = lerp(-3, -7, prog(t, 7.84, 9)); c.rx = lerp(0, 4, prog(t, 7.84, 9)); }
  else if (t < 10) { const p = eInOut(prog(t, 9, 9.35)); c.z = lerp(1.5, 1, p); c.fy = lerp(700, 1200, p); c.ry = lerp(8, 4, prog(t, 9, 10)); }
  else if (t < 11) { c.rx = lerp(8, 3, eOut(prog(t, 10, 11))); c.ry = lerp(-6, -3, prog(t, 10, 11)); }
  else if (t < 11.5) { c.rx = lerp(-8, -3, eOut(prog(t, 11, 11.5))); c.ry = 3; }
  else if (t < 13) { const p = eInOut(prog(t, 11.5, 13)); c.z = lerp(1.0, 1.06, p); c.y = lerp(1000, 1010, p); c.ry = lerp(-3, 3, p); }
  else if (t < 13.4) { const p = prog(t, 13, 13.3); c.z = lerp(1.12, .5, eInOut(p)); c.y = lerp(1000, 2600, Math.pow(p, 2)); c.rz = lerp(0, 18, p); c.rx = lerp(0, 30, p); c.o = 1 - prog(t, 13.12, 13.3); c.blur = p * 10; }
  else c.o = 0;
  // 重拍时推一下，带轻微抖动
  let k = 0; for (const b of BEATS_HIT) k = Math.max(k, pulse(t, b, .3));
  c.z *= 1 + .035 * k; c.rz += Math.sin(t * 90) * 1.2 * k;
  return c;
}
function placeRig(c) {
  // 变换原点放在对准点上：对准点落到 (c.x, c.y)，缩放和倾斜都绕它进行
  const ox = RIG_W / 2 + (c.fx - 540) * S, oy = RIG_H / 2 + (c.fy - 1200) * S;
  css($('#rig'), { opacity: c.o, filter: c.blur ? `blur(${c.blur}px)` : 'none', transformOrigin: `${ox}px ${oy}px`,
    transform: `translate(${c.x - ox}px, ${c.y - oy}px) rotateX(${c.rx}deg) rotateY(${c.ry}deg) rotateZ(${c.rz}deg) scale(${c.z})` });
}

// ---------- 主函数 ----------
window.seek = async function seek(tn) {
  const t = tmap(tn);   // tn：成片时间（实拍素材用）；t：动效时间
  // 安全灯：0–2 微弱，2.0 关灯，2.5 / 2.62 闪两下，3.0 亮起
  const flick = t >= 2 && t < 3 ? Math.max(pulse(t, 2.5, .1), pulse(t, 2.62, .12)) : 0;   // 和配乐 2.5 / 2.62 的咔哒声对齐
  let light = t < 2 ? .25 : t < 3 ? 1.3 * flick : 1;
  if (t >= 3) light = 1 + .6 * pulse(t, 3, .6);
  if (t >= END) light = .9 + .3 * pulse(t, END, .6);
  $('#safelight').style.opacity = clamp(light, 0, 1.6);
  $('#floor').style.opacity = t >= 3 ? .8 : 0;
  $('#bulb').style.opacity = t >= 2 && t < 3 ? .12 + .88 * Math.min(1, flick * 1.6) : t >= 3 && t < 13 ? clamp(light) : 0;   // 重拍段和片尾不挂灯条

  // 开场照片墙：从远处旋入，2.0 熄灭
  const wp = prog(t, 0, 2);
  css($('#wall'), { transform: `translateZ(${lerp(-2600, 300, eOut(wp))}px) rotateX(${lerp(58, 24, eOut(wp))}deg) rotateZ(${lerp(-40, 4, eOut(wp))}deg)` });
  const wallOn = t < 2 ? lerp(.25, 1, eOut(prog(t, 0, .4))) * (1 - .45 * prog(t, 1.0, 2)) : 0;
  $('#wallBox').style.opacity = wallOn; $('#wallShade').style.opacity = t < 2 ? 1 : 0;
  // 计数
  const cp = prog(t, 0, 1.0); const cnt = Math.max(1, Math.round(12847 * (1 - Math.pow(1 - cp, 2.2))));
  $('#cn').textContent = cnt.toLocaleString('en-US');
  const land = pulse(t, 1.0, .35);
  css($('#counter'), { opacity: t < 2 ? 1 : 0, transform: `scale(${lerp(.86, 1, eOut(prog(t, 0, 1))) * (1 + .1 * land)})` });
  css($('#cn'), { textShadow: `0 ${cp < 1 ? 18 : 0}px ${cp < 1 ? 30 : 60}px rgba(242,169,59,${cp < 1 ? .35 : .5 + land * .5})`, color: land > 0 ? '#FFE2B0' : '#EEE9E2' });
  css($('#cl'), { opacity: prog(t, 1.0, 1.2), transform: `translateY(${(1 - eOut(prog(t, 1.0, 1.25))) * 30}px)` });
  // 关灯
  const dk = $('#dark');
  if (t >= 2 && t < 3) { const two = t >= 2.5; dk.innerHTML = two ? T('关上灯<small>一次只看一张</small>', 'Lights off.<small>ONE PHOTO AT A TIME</small>') : T('关上灯', 'Lights off.'); const p = prog(t, 2, 2.12);
    css(dk, { opacity: p * (.62 + .38 * Math.min(1, flick * 1.6)), transform: `scale(${lerp(1.4, 1, eExpo(p))})`, filter: `blur(${(1 - p) * 10}px)`, color: flick > .05 ? `rgb(255,${Math.round(233 - 30 * flick)},${Math.round(226 - 110 * flick)})` : '#EEE9E2', textShadow: `0 0 ${30 + 60 * flick}px rgba(242,169,59,${(.9 * flick).toFixed(2)})` }); css(dk.querySelector('small') ?? dk, two ? { opacity: prog(t, 2.5, 2.6) } : {}); }
  else dk.style.opacity = 0;

  // 手机 + 实拍
  const c = camera(t); placeRig(c);
  document.documentElement.style.setProperty('--rigGlow', t >= 3 ? (.18 + .4 * Math.max(...BEATS_HIT.map(b => pulse(t, b, .4)))).toFixed(3) : 0);
  if (c.o > 0) await setFootage(tn);
  const gl = Math.max(pulse(t, 3.05, .7), pulse(t, 7.0, .6), pulse(t, 11.5, .6));
  css($('#glare'), { opacity: gl > 0 ? 1 : 0, backgroundPosition: `${lerp(120, -20, 1 - gl)}% 0` });

  // 上滑 / 下滑的大箭头（叠在手机上）
  let ao = 0, ay = 0, flip = false;
  for (const [a0, up] of [[4.1, true], [5.1, false], [10.08, true], [11.06, false]]) { const p = prog(t, a0, a0 + .5); if (t >= a0 && t < a0 + .5) { ao = Math.sin(Math.PI * p); ay = up ? lerp(1250, 450, eOut(p)) : lerp(450, 1250, eOut(p)); flip = !up; } }
  for (const [id, d] of [['#arrowL', 0], ['#arrowR', 40]]) css($(id), { opacity: ao, transform: `translateY(${ay + (flip ? -d : d)}px) ${flip ? 'scaleY(-1)' : ''}`, filter: flip ? 'grayscale(1) brightness(1.5)' : 'drop-shadow(0 0 20px rgba(242,169,59,.7))' });

  setHeader(t); setLabel(t);

  // 片尾
  const o = $('#outro'); o.style.opacity = t >= END ? 1 : 0; o.style.transform = `scale(${lerp(1, 1.05, eInOut(prog(t, END + .4, ANIM_END)))})`;
  const sp = prog(t, 15.6, 16.6); css($('#sweep'), { opacity: sp > 0 && sp < 1 ? 1 : 0, backgroundPosition: `${lerp(110, -10, eInOut(sp))}% 0` });
  drawDust(t);
  if (t >= END) {
    css($('#line'), { transform: `scaleX(${eExpo(prog(t, 13, 13.4))})` });
    [...$('#prints').children].forEach((el, i) => { const t0 = 13.05 + i * .07; const p = prog(t, t0, t0 + .45); const sw = Math.exp(-2.6 * Math.max(0, t - t0 - .3)) * Math.sin((t - t0) * 9) * 9;
      css(el, { opacity: p > 0 ? 1 : 0, transform: `translateY(${lerp(-700, 0, spring(p, 8, 5))}px) rotate(${PRINTS[i][2] + (p >= 1 ? sw : (1 - p) * 20)}deg)` }); });
    const ip = prog(t, 13.3, 13.75); css($('#icon'), { opacity: ip > 0 ? 1 : 0, transform: `scale(${eBack(ip)}) rotate(${(1 - eOut(ip)) * -20}deg)` });
    const tp = prog(t, 13.5, 13.85); css($('#title'), { opacity: tp, transform: `translateY(${(1 - eOut(tp)) * 50}px)`, filter: `blur(${(1 - tp) * 10}px)`, letterSpacing: 0 });
    css($('#tag'), { opacity: prog(t, 14.1, 14.4), transform: `translateY(${(1 - eOut(prog(t, 14.1, 14.4))) * 24}px)` });
    const n = Math.round(URL_TEXT.length * prog(t, 14.4, 15.2)); $('#ut').textContent = URL_TEXT.slice(0, n);
    $('#uc').style.opacity = t < 14.4 || t >= 15.9 ? 0 : t < 15.2 ? 1 : (Math.floor((t - 15.2) * 5.7) % 2 ? 0 : 1); $('#us').style.opacity = prog(t, 15.2, 15.5);
  }
  // 全屏闪光
  let fl = 0; for (const b of BEATS_HIT) fl = Math.max(fl, .5 * pulse(t, b, .22)); fl = Math.max(fl, .4 * flick, pulse(t, 3, .5), .45 * pulse(t, 0, .2), .55 * pulse(t, 1.0, .3), .3 * pulse(t, END, .25));
  $('#flash').style.opacity = fl;
  $('#white').style.opacity = .35 * pulse(t, 3, .12) + 0;
  // 颗粒
  const gctx = $('#grain').getContext('2d'); gctx.drawImage(grains[Math.floor(t * FPS) % 4], 0, 0);
  $('#fadeout').style.opacity = prog(t, ANIM_END - .3, ANIM_END);
};

// 安全灯光锥里的浮尘（确定性：位置只由 t 决定）
const DUST = Array.from({ length: 70 }, (_, i) => { const r = k => { const x = Math.sin(i * 127.1 + k * 311.7) * 43758.5453; return x - Math.floor(x); }; return { x: r(1) * 1080, y: r(2) * 1920, s: 1 + r(3) * 3.2, vx: (r(4) - .5) * 30, vy: -8 - r(5) * 26, ph: r(6) * 6.28, a: .25 + r(7) * .6 }; });
function drawDust(t) {
  const g = $('#dust').getContext('2d'); g.clearRect(0, 0, 1080, 1920);
  const on = t >= 3 && t < END ? .55 : t >= END ? 1 : 0; if (!on) return;
  for (const d of DUST) { const x = (d.x + d.vx * t + Math.sin(t * .9 + d.ph) * 24 + 1080) % 1080, y = ((d.y + d.vy * t) % 1920 + 1920) % 1920;
    const cone = Math.max(0, 1 - Math.abs(x - 540) / (260 + y * .35)) * Math.max(0, 1 - y / 1900);
    const a = d.a * cone * on * (.6 + .4 * Math.sin(t * 2.3 + d.ph)); if (a < .02) continue;
    g.fillStyle = `rgba(255,214,150,${a.toFixed(3)})`; g.beginPath(); g.arc(x, y, d.s, 0, 6.283); g.fill(); }
}
window.DURATION = DURATION;
window.ready = document.fonts.ready.then(() => Promise.all([...document.images].map(i => i.decode().catch(() => {})))).then(() => seek(+(new URLSearchParams(location.search).get('t') ?? 0)));
// 预览：点一下播放 / 暂停
let playing = false, t0 = 0, base = 0;
$('#stage').addEventListener('click', () => { playing = !playing; base = window.__t ?? 0; t0 = performance.now(); if (playing) loop(); });
async function loop() { if (!playing) return; const t = (base + (performance.now() - t0) / 1000) % DURATION; window.__t = t; await seek(t); requestAnimationFrame(loop); }
function fit() { const s = Math.min(innerWidth / 1080, innerHeight / 1920); $('#stage').style.transform = `scale(${s})`; }
if (!navigator.webdriver) { addEventListener('resize', fit); fit(); }
</script>
