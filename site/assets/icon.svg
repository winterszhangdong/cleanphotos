      <rect x="4" y="4" width="28" height="28" fill="url(#sky)"/>
      <circle cx="24" cy="11" r="3.4" fill="#FFD24A"/>
      <path d="M4,32L4,24L9,20L17,32z" fill="#7CCB86"/>
      <path d="M4,32L13,19L19,26L23,22L32,32z" fill="#3FA866"/>
