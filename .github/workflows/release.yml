name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - name: 核对 tag 与 versionName
        # tag 和 app/build.gradle.kts 的 versionName 不一致时直接失败：否则 APK 文件名、发布说明和包内版本号对不上
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          app_version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)"
          if [ "$tag_version" != "$app_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME 与 versionName $app_version 不一致"
            exit 1
          fi
      - name: 从 CHANGELOG 生成发布说明
        # 先于构建执行：CHANGELOG 缺这一版或为空时直接失败，不浪费构建
        run: scripts/release-notes.sh "$GITHUB_REF_NAME" CHANGELOG.md > "$RUNNER_TEMP/release-notes.md"
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platforms;android-36
      - name: 单元测试
        # 测试不过不出包
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: 写入发布证书
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          {
            echo "storeFile=$RUNNER_TEMP/release.keystore"
            echo "storePassword=$RELEASE_STORE_PASSWORD"
            echo "keyAlias=cleanphotos"
            echo "keyPassword=$RELEASE_KEY_PASSWORD"
          } > keystore.properties
      - name: 构建 release APK
        run: |
          ./gradlew assembleRelease --stacktrace
          version="${GITHUB_REF_NAME#v}"
          mv app/build/outputs/apk/release/app-release.apk "CleanPhotos-$version.apk"
      - uses: softprops/action-gh-release@v3.0.3
        with:
          files: CleanPhotos-*.apk
          body_path: ${{ runner.temp }}/release-notes.md
      - name: 把 APK 交给官网任务
        uses: actions/upload-artifact@v7.0.2
        with:
          name: apk
          path: CleanPhotos-*.apk
          retention-days: 3

  site:
    # 官网同步：GitHub Release 发布成功后，把同一个 APK 放进官网并部署到 Cloudflare Workers。
    # continue-on-error：这一步失败只会标黄，不影响已经发布的 GitHub Release。
    needs: apk
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    concurrency:
      group: site-deploy
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: 检查 Cloudflare 凭据
        id: cf
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::warning::没有配置 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，跳过官网部署"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7.0.1
        if: steps.cf.outputs.skip != 'true'
      - uses: actions/download-artifact@v8.0.2
        if: steps.cf.outputs.skip != 'true'
        with:
          name: apk
          path: ${{ runner.temp }}/apk
      - uses: actions/setup-node@v7.1.0
        if: steps.cf.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: 同步 APK 与版本信息
        # 最新版用刚构建的 APK；上一版从 GitHub Release 取。每个文件都核对 sha256 和签名证书
        if: steps.cf.outputs.skip != 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/site-sync-release.sh --apk "$RUNNER_TEMP/apk/CleanPhotos-${GITHUB_REF_NAME#v}.apk" --tag "$GITHUB_REF_NAME"
      - name: 构建官网
        if: steps.cf.outputs.skip != 'true'
        working-directory: site
        run: |
          npm ci
          npm run build
      - name: 部署到 Cloudflare Workers
        # 这一步才是官网是否上线的判断：wrangler 失败或者没给出 Version ID 都算失败
        id: deploy
        if: steps.cf.outputs.skip != 'true'
        working-directory: site
        shell: bash
        run: |
          npx wrangler deploy 2>&1 | tee "$RUNNER_TEMP/wrangler.log"
          id="$(sed -n 's/.*Current Version ID: *\([0-9a-f-]\{36\}\).*/\1/p' "$RUNNER_TEMP/wrangler.log" | tail -n 1)"
          if [ -z "$id" ]; then
            echo "::error::wrangler deploy 没有输出 Current Version ID，官网可能没有部署成功"
            exit 1
          fi
          echo "version_id=$id" >> "$GITHUB_OUTPUT"
          echo "官网已部署：Worker 版本 $id" >> "$GITHUB_STEP_SUMMARY"
      - name: 核对线上最新版
        # 补充核对：拿到 JSON 但版本不对才失败；Cloudflare 拦 runner（403 / 非 JSON）只标 warning
        if: steps.cf.outputs.skip != 'true'
        run: scripts/site-check-live.sh "${GITHUB_REF_NAME#v}"
